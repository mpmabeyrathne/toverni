openapi: 3.0.3
info:
  title: Local Auth Benchmark API
  version: 1.0.0
paths:
  /api/session:
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200': { description: Session created }
        '401': { description: Invalid credentials }
    delete:
      operationId: deleteSession
      responses:
        '204': { description: Signed out }
  /api/admin:
    get:
      operationId: getAdminPanel
      responses:
        '200': { description: Admin content }
        '403': { description: Forbidden }


components:
  schemas:
    SessionRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          example: pass
