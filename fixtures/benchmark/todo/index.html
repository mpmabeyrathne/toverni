<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark Todo</title>
</head>

<body>
  <main>
    <h1>Todo List</h1>

    <label for="todo-title">
      Todo title
    </label>

    <input
      id="todo-title"
      type="text"
    >

    <button
      id="add-todo"
      type="button"
    >
      Add Todo
    </button>

    <ul id="todos">
      <li>
        <span>
          Learn Playwright
        </span>

        <button
          type="button"
        >
          Complete Todo
        </button>

        <button
          type="button"
        >
          Delete Todo
        </button>
      </li>
    </ul>
  </main>

  <script>
    const list =
      document.getElementById(
        'todos',
      );

    const input =
      document.getElementById(
        'todo-title',
      );

    document
      .getElementById(
        'add-todo',
      )
      .addEventListener(
        'click',
        () => {
          const title =
            input.value.trim();

          if (!title) {
            return;
          }

          const item =
            document.createElement(
              'li',
            );

          const label =
            document.createElement(
              'span',
            );

          label.textContent =
            title;

          const complete =
            document.createElement(
              'button',
            );

          complete.type =
            'button';

          complete.textContent =
            'Complete Todo';

          const remove =
            document.createElement(
              'button',
            );

          remove.type =
            'button';

          remove.textContent =
            'Delete Todo';

          item.append(
            label,
            complete,
            remove,
          );

          list.appendChild(
            item,
          );

          input.value = '';
        },
      );

    list.addEventListener(
      'click',
      (
        event,
      ) => {
        const target =
          event.target;

        if (
          !(
            target instanceof
            HTMLButtonElement
          )
        ) {
          return;
        }

        const item =
          target.closest(
            'li',
          );

        if (!item) {
          return;
        }

        if (
          target.textContent
            ?.trim() ===
          'Complete Todo'
        ) {
          const label =
            item.querySelector(
              'span',
            );

          if (!label) {
            return;
          }

          const title =
            label.textContent
              ?.replace(
                /\s*\(completed\)$/,
                '',
              )
              .trim() ??
            '';

          label.textContent =
            `${title} (completed)`;

          target.disabled =
            true;

          return;
        }

        if (
          target.textContent
            ?.trim() ===
          'Delete Todo'
        ) {
          item.remove();
        }
      },
    );
  </script>
</body>
</html>
