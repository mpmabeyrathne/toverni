<!doctype html><html><body><main><h1>Document Upload</h1><input id="file" aria-label="Upload file" type="file" accept=".txt"><button id="upload" disabled>Upload</button><button id="retry" hidden>Retry</button><button id="clear">Clear</button><p id="status">No file selected</p></main><script>
const f=document.querySelector('#file'),u=document.querySelector('#upload'),r=document.querySelector('#retry'),s=document.querySelector('#status');let attempts=0;f.onchange=()=>{const file=f.files[0];if(!file){s.textContent='No file selected';u.disabled=true;return;}if(!file.name.endsWith('.txt')){s.textContent='Only .txt files are allowed';u.disabled=true;return;}s.textContent=file.name+' ready';u.disabled=false;attempts=0;};u.onclick=()=>{attempts++;s.textContent='Upload failed';r.hidden=false;};r.onclick=()=>{attempts++;s.textContent='Uploaded';r.hidden=true;};document.querySelector('#clear').onclick=()=>{f.value='';u.disabled=true;r.hidden=true;s.textContent='No file selected';attempts=0;};
</script></body></html>
