<!doctype html><html><body><main><h1>Checkout</h1><section id="s1"><label>Name <input aria-label="Customer name" id="name"></label><button id="next1">Continue</button><p id="e1"></p></section><section id="s2" hidden><label>Address <input aria-label="Shipping address" id="address"></label><button id="next2">Continue to Payment</button><p id="e2"></p></section><section id="s3" hidden><label>Card <input aria-label="Card number" id="card"></label><button id="review">Review Order</button><p id="e3"></p></section><dialog id="confirm"><p>Confirm order total $25</p><button id="confirmBtn">Confirm Order</button><button id="cancelBtn">Cancel</button></dialog><h2 id="done"></h2></main><script>
const q=s=>document.querySelector(s); q('#next1').onclick=()=>{if(!q('#name').value){q('#e1').textContent='Name is required';return;}q('#s1').hidden=true;q('#s2').hidden=false;}; q('#next2').onclick=()=>{if(!q('#address').value){q('#e2').textContent='Address is required';return;}q('#s2').hidden=true;q('#s3').hidden=false;}; q('#review').onclick=()=>{if(q('#card').value!=='4242424242424242'){q('#e3').textContent='Invalid card';return;}q('#e3').textContent='';q('#confirm').showModal();}; q('#confirmBtn').onclick=()=>{q('#confirm').close();q('#done').textContent='Order complete';};q('#cancelBtn').onclick=()=>q('#confirm').close();
</script></body></html>
