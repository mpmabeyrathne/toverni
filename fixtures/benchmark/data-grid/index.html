<!doctype html><html><body><main><h1>Orders</h1><label>Search <input aria-label="Search customers" id="search"></label><label>Status <select aria-label="Status filter" id="status"><option>All</option><option>Paid</option><option>Pending</option></select></label><button id="sort">Sort Amount</button><button id="refresh">Refresh</button><table><thead><tr><th>Customer</th><th>Status</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table><p id="empty"></p><button id="prev">Previous Page</button><span id="page">Page 1</span><button id="next">Next Page</button></main><script>
let page=1,asc=true,updated=false;const data=[['Alice','Paid',30],['Bob','Pending',10],['Cara','Paid',50],['Dan','Pending',20]];const q=s=>document.querySelector(s);function render(){let x=[...data].filter(r=>r[0].toLowerCase().includes(q('#search').value.toLowerCase())).filter(r=>q('#status').value==='All'||r[1]===q('#status').value).sort((a,b)=>asc?a[2]-b[2]:b[2]-a[2]);const slice=x.slice((page-1)*2,page*2);q('#rows').innerHTML=slice.map(r=>'<tr><td>'+r[0]+'</td><td>'+(updated?'Updated':r[1])+'</td><td>'+r[2]+'</td></tr>').join('');q('#empty').textContent=slice.length?'':'No results';q('#page').textContent='Page '+page;}q('#search').oninput=()=>{page=1;render()};q('#status').onchange=()=>{page=1;render()};q('#sort').onclick=()=>{asc=!asc;render()};q('#next').onclick=()=>{page=2;render()};q('#prev').onclick=()=>{page=1;render()};q('#refresh').onclick=()=>{updated=true;render()};render();
</script></body></html>
